name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Enforce least-privilege permissions for GitHub Actions token
permissions:
  contents: read

jobs:
  test:
    name: Test & Security Evaluation (Python ${{ matrix.python-version }})
    # Explicit LTS runner image to avoid unpredicted ubuntu-latest runner OS migrations
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24 runtime)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24 runtime)
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Run Deterministic Security Evaluation Runner
        run: |
          python scripts/evaluate_security.py --output ci_evaluation_report.json --audit-db ci_audit.db

      - name: Verify Tamper-Evident Audit Chain Integrity
        run: |
          python scripts/verify_audit.py --db ci_audit.db --min-events 14

      - name: Upload Evaluation Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24 runtime)
        with:
          name: evaluation-report-py${{ matrix.python-version }}
          path: ci_evaluation_report.json
          retention-days: 7

  docker-validate:
    name: Docker Configuration & Image Build Check
    # Explicit LTS runner image to avoid unpredicted ubuntu-latest runner OS migrations
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24 runtime)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (Node 24 runtime)

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Verify Docker Compose Build
        run: |
          docker compose build
